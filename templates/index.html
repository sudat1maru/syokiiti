<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>座標検出(仮)</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #f5f5f5);

            margin: 0;
            padding: 20px 10px;

            display: flex;
            justify-content: center;

            min-height: 100vh;

            overflow-y: auto;
        }

        .box {
            background: white;

            width: min(500px, 95vw);

            padding: 25px;

            border-radius: 20px;

            box-shadow: 0 10px 25px rgba(0,0,0,0.15);

            text-align: center;

            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 20px;
            font-size: clamp(22px, 5vw, 28px);
        }

        input[type="file"] {
            width: 100%;
            margin-bottom: 15px;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            background: #2196F3;
            color: white;

            border-radius: 10px;

            cursor: pointer;

            font-weight: bold;

            font-size: 16px;
        }

        button:hover {
            background: #1976D2;
        }

        #preview {
            margin-top: 20px;
        }

        #preview img {
            width: 100%;

            max-height: 400px;

            object-fit: contain;

            border-radius: 10px;

            border: 1px solid #ddd;
        }

        #result {
            margin-top: 20px;
        }

        .item {
            background: #f0f0f0;

            padding: 15px;

            margin-bottom: 12px;

            border-radius: 10px;

            text-align: left;
        }

        .label {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .box {
                padding: 18px;
            }

            .label {
                font-size: 16px;
            }

            button {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<div class="box">

    <h2>座標検出(仮)</h2>

    <input
        type="file"
        id="image"
        accept="image/*"
        onchange="previewImage()"
    >

    <button onclick="upload()">
        解析する
    </button>

    <div id="preview"></div>

    <div id="result"></div>

</div>

<script>

function previewImage() {

    const file =
        document.getElementById("image").files[0];

    const preview =
        document.getElementById("preview");

    if (!file) {
        preview.innerHTML = "";
        return;
    }

    const url = URL.createObjectURL(file);

    preview.innerHTML = `
        <img src="${url}">
    `;
}

function upload() {

    const file =
        document.getElementById("image").files[0];

    if (!file) {
        alert("画像を選択してください");
        return;
    }

    const formData = new FormData();

    formData.append(
        "image",
        file
    );

    fetch("/upload", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => displayResult(data))
    .catch(err => {
        alert("解析に失敗しました");
        console.error(err);
    });
}

function displayResult(data) {

    let html = "";

    const order = [
        "1st",
        "2nd",
        "3rd",
        "4th"
    ];

    order.forEach(label => {

        if (!data[label]) return;

        if (data[label].error) {

            html += `
                <div class="item error">
                    ${label}: ${data[label].error}
                </div>
            `;

            return;
        }

        html += `
            <div class="item">

                <div class="label">
                    ${label}
                </div>

                <div>
                    X: ${data[label].x}
                </div>

                <div>
                    Y: ${data[label].y}
                </div>

                <div>
                    一致率: ${data[label].score}
                </div>

            </div>
        `;
    });

    document.getElementById("result").innerHTML = html;
}

</script>

</body>
</html>
